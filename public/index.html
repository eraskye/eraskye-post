<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERASKYE</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2b;
        --accent: #7dd3fc;
        --text: #e5eefb;
        --muted: #b7c5da;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg), #1a2338 60%, #0f172a);
        font-family: Arial, sans-serif;
        color: var(--text);
      }
      .card {
        width: min(720px, 90vw);
        background: rgba(18, 26, 43, 0.9);
        border: 1px solid rgba(125, 211, 252, 0.35);
        border-radius: 20px;
        padding: 40px 32px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 4rem);
        letter-spacing: 0.08em;
        color: var(--accent);
      }
      p {
        color: var(--muted);
        font-size: 1.1rem;
        line-height: 1.6;
      }
      .status {
        margin-top: 24px;
        padding: 12px 16px;
        border-radius: 10px;
        background: rgba(125, 211, 252, 0.08);
        border: 1px solid rgba(125, 211, 252, 0.25);
        color: var(--text);
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>ERASKYE</h1>
      <p>Project restored and running in GitHub Codespaces.</p>
      <div class="status">Status: ready</div>
    </main>
  </body>
</html>
