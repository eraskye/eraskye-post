<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#0a0a0b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>ERASKYE</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="logo">ERA<span>SKYE</span></div>
    <button class="icon-btn" id="logoutBtn" title="Logout">⎋</button>
  </header>
  <main id="main"></main>
  <nav class="bottom-nav">
    <button data-view="feed" class="nav-item">⌂<span>Home</span></button>
    <button data-view="search" class="nav-item">⌕<span>Search</span></button>
    <button data-view="create" class="nav-item nav-create">+</button>
    <button data-view="notifications" class="nav-item">♥<span>Alerts</span><i class="badge" id="notifBadge" hidden></i></button>
    <button data-view="profile" class="nav-item">◉<span>Profile</span></button>
  </nav>
</div>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
